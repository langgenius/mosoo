name: PR Check

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    name: Repository check
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: canary

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: 1.57.0

      - name: Install native checkpoint test tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes squashfs-tools

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run repository check
        run: just check

      - name: Install fixture browser
        run: just e2e-browser-install

      - name: Verify persisted Preview model selection
        run: just e2e e2e/cases/ui/preview-runtime-model.spec.ts

      - name: Verify Preview credential dialogs
        run: just e2e e2e/cases/ui/preview-credential-dialog.spec.ts

      - name: Verify native Host checkpoint recovery
        run: just test-native-host-checkpoint
