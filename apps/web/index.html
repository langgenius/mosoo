<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Open-source agent runtime for coding agents. Run OpenAI Codex, Claude Agent SDK, and OpenCode behind API endpoints in isolated sandboxes."
    />
    <!-- Matches --bg (--paper-100) so browser chrome blends with the app surface. -->
    <meta name="theme-color" content="#fbfbfc" />
    <meta property="og:title" content="mosoo" />
    <meta
      property="og:description"
      content="Open-source agent runtime for coding agents. Run OpenAI Codex, Claude Agent SDK, and OpenCode behind API endpoints in isolated sandboxes."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="mosoo" />
    <meta name="twitter:card" content="summary" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>mosoo</title>
    <!-- Set html lang attribute early based on stored locale preference.
         Falls back to navigator.language. Runs before React mounts so the
         browser uses the correct spelling dictionary and accessibility
         voice from the first paint. -->
    <script>
      (function () {
        var stored = localStorage.getItem("mosoo-locale");
        var lang = stored || navigator.language || "en";
        if (lang.toLowerCase().startsWith("zh")) lang = "zh-CN";
        else lang = "en";
        document.documentElement.lang = lang;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
