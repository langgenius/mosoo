"$schema" = "../../node_modules/wrangler/config-schema.json"

name = "mosoo-web"
compatibility_date = "2026-06-01"
main = "src/worker.ts"

[assets]
directory = "./dist"
binding = "ASSETS"
# Domain and HTTPS redirects must run before static asset matches.
run_worker_first = true
# The Worker (src/worker.ts) owns SPA fallback so unknown console paths can be
# handled by react-router.
not_found_handling = "none"

[env.stage]
name = "mosoo-web-stage"
workers_dev = true

[[env.stage.services]]
binding = "API"
service = "mosoo-api-stage"

[env.prod]
name = "mosoo-web-prod"
workers_dev = false

[[env.prod.routes]]
pattern = "cloud.mosoo.ai"
custom_domain = true

[[env.prod.routes]]
pattern = "try.mosoo.ai"
custom_domain = true

[[env.prod.services]]
binding = "API"
service = "mosoo-api-prod"
