# Mosoo Console icon registry.
#
# Governs the boundary between general interface glyphs (Hugeicons Free through
# the semantic adapter in apps/web/src/shared/ui/icons.tsx) and purpose-built
# SVGs (brand, vendor, runtime, sidebar, state, and illustration art). The
# design gate test apps/web/tests/console-design-contract-boundary.test.ts reads
# this file: every createHugeicon(...) registration in the web app must appear
# under `general` or `navigation`, and purpose-built assets must appear under
# `purpose_built`. Add an entry in the same change that adds the icon.
#
# Rules (docs/design/console-design-contract.md, section 6):
# - General glyphs render from currentColor at a 1.5 stroke, 16px inline and
#   20px in empty states; they never carry colour of their own.
# - Purpose-built marks keep their own colour and are never used as generic
#   glyphs; general glyphs are never used to stand in for a brand.
# - No emoji, no one-off "close enough" substitutes, no second icon library.
version: 1

libraries:
  hugeicons_free:
    package: "@hugeicons/core-free-icons"
    adapter: apps/web/src/shared/ui/icons.tsx
    stroke: 1.5
    sizes: [16, 20]
  purpose_built:
    construction: 24 grid, 1.5 stroke, round caps and joins, currentColor unless the mark owns a brand colour

# Semantic export name in icons.tsx -> Hugeicons source glyph.
