# Shell and navigation glyphs registered next to the surface that owns them.
navigation:
  AccountMenuChevronIcon:
    source: ChevronsDownUpIcon
    owner: app/account-menu.tsx
  AccountMenuSettingsIcon:
    source: Settings02Icon
    owner: app/account-menu.tsx
  AccountMenuSignOutIcon:
    source: Logout01Icon
    owner: app/account-menu.tsx
  BackIcon:
    source: ArrowLeft01Icon
    owner: app/app-shell.tsx
  CheckmarkIcon:
    source: CheckIcon
    owner: app/app-shell.tsx
  CollapseSidebarIcon:
    source: PanelLeftCloseIcon
    owner: app/app-shell.tsx
  ExpandSidebarIcon:
    source: PanelLeftOpenIcon
    owner: app/app-shell.tsx
  NewAgentIcon:
    source: Add01Icon
    owner: app/app-shell.tsx
  SwitcherChevronIcon:
    source: ChevronsDownUpIcon
    owner: app/app-shell.tsx
  ProjectSettingsIcon:
    source: Settings02Icon
    owner: app/navigation.tsx
  BillingIcon:
    source: Wallet02Icon
    owner: app/org-navigation.tsx
  OrgSettingsIcon:
    source: Settings02Icon
    owner: app/org-navigation.tsx
  ProjectsIcon:
    source: GridViewIcon
    owner: app/org-navigation.tsx
  UsageIcon:
    source: ChartLineData01Icon
    owner: app/org-navigation.tsx
  LanguageIcon:
    source: LanguageCircleIcon
    owner: shared/i18n/locale-switcher.tsx
  SelectedLocaleIcon:
    source: CheckIcon
    owner: shared/i18n/locale-switcher.tsx

purpose_built:
  product:
    - id: logo-mark
      path: apps/web/public/brand/logo-mark.svg
      colour: brand green on white; the only place the raw brand hex is allowed outside tokens
    - id: logo-wordmark-onlight
      path: apps/web/public/brand/logo-wordmark-onlight.svg
    - id: logo-wordmark-ondark
      path: apps/web/public/brand/logo-wordmark-ondark.svg
    - id: favicon
      path: apps/web/public/favicon.svg
  sidebar:
    owner: apps/web/src/shared/ui/sidebar-icons.tsx
    assets: docs/design/assets/sidebar-icons/
    ids: [overview, runs, agents, files, skills, mcp-servers, providers, environments]
    reading: currentColor duotone family for the eight Project work rows (docs/design/console-sidebar.md, section 4)
  vendor:
    owner: apps/web/src/shared/ui/brand-icons/vendor-icon-data.ts
    ids: [anthropic, deepseek, gemini, kimi, minimax, openai, opencode, qwen, zhipu]
    reading: model vendor marks; keep their own colour, render inside a neutral tile
  runtime:
    owner: apps/web/src/shared/ui/brand-icons/runtime-icon-data.ts
    ids: [claude-code, cline, codex, cursor, openai, opencode]
    reading: agent runtime marks; keep their own colour, render inside a neutral tile
  channel:
    owner: apps/web/src/routes/integrations/mcp/icon-avatar.tsx
    reading: MCP server favicons or a deterministic letter tile; the fixed avatar palette is allowed because it identifies a server, not a Mosoo state
  state:
    owner: apps/web/src/routes/threads/thread-state-icon.tsx
    ids: [working, success, failed, archived]
    reading: run lifecycle glyphs; colour comes from semantic status tokens, never from the brand accent
  illustration:
    owner: apps/web/src/routes/login/doodles.tsx
    reading: login doodles are illustration, not interface glyphs; they do not appear inside the console shell
